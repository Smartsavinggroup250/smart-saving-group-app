{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Monthly Contribution</h2>

    <div class="card mt-3">
        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Submit Contribution
                </button>

                <a
                    href="{% url 'contribution_list' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
